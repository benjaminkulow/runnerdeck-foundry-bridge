name: Release
# Neuer Release, sobald sich die Version in module.json ändert (Tag wird hier angelegt).
on:
  push:
    branches: [main]
    paths: ["module.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen, Download-Link setzen
        run: |
          V=$(jq -r .version module.json)
          echo "TAG=v$V" >> "$GITHUB_ENV"
          jq --arg d "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$V/module.zip" '.download=$d' module.json > m.json && mv m.json module.json
      - name: Paket bauen
        run: |
          zip -r module.zip module.json scripts lang styles LICENSE README.md
          # Zum direkten Einspielen (Ordner runnerdeck-bridge/ für Data/modules oder Forge-Import)
          ID=$(jq -r .id module.json)
          mkdir -p "pkg/$ID" && cp -r module.json scripts lang styles LICENSE README.md "pkg/$ID/"
          (cd pkg && zip -r "../$ID-$TAG.zip" "$ID")
          echo "PKG=$ID-$TAG.zip" >> "$GITHUB_ENV"
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" module.json module.zip "$PKG" --clobber; exit 0; fi
          gh release create "$TAG" module.json module.zip "$PKG" --target "$GITHUB_SHA" --title "RunnerDeck Bridge $TAG" --notes "Manifest-URL zum Installieren in Foundry: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/module.json  ·  Zum direkten Einspielen (Foundry-Ordner Data/modules oder Forge Import Wizard): $PKG herunterladen."
